app-id: org.padforge.PadForge
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: padforge
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.FileChooser
separate-locales: false

modules:
  - name: padforge
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPADFORGE_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/padforge/padforge.git
        tag: v0.1.0
    post-install:
      - install -d /app/share/padforge/plugins
      - cp -r plugins/lua/. /app/share/padforge/plugins/
