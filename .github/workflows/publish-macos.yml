name: Publish macOS release asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach the macOS disk image to
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-macos:
    name: Build and publish Apple Silicon installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja qt lua@5.4

      - name: Build, test, and package macOS app
        run: ./packaging/macos/package-macos.sh

      - name: Attach installer to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/PadForge-macos-arm64.dmg --repo "$GITHUB_REPOSITORY" --clobber
