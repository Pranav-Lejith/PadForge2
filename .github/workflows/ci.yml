name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
        build_type: [ Release ]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev \
            libgl1-mesa-dev liblua5.4-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPADFORGE_BUILD_TESTS=ON \
            -DPADFORGE_ENABLE_LUA=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Install staging check
        run: DESTDIR="${{ runner.temp }}/stage" cmake --install build

  core-only:
    name: Core-only build (no Scintilla)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 qt6-base-dev liblua5.4-dev
      - name: Configure
        run: |
          cmake -S . -B build-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPADFORGE_USE_SYSTEM_SCINTILLA=ON \
            -DPADFORGE_BUILD_TESTS=ON
      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build-core --parallel
          ctest --test-dir build-core --output-on-failure
